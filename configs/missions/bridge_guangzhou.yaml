mission_id: bridge_guangzhou_001
instruction: "在广州城区找到跨江或跨河主桥，环绕拍摄并用于三维建模"

search_area:
  center_xy: [1000.0, -250.0]
  radius_m: 150.0
  altitude_m: 40.0

target:
  visual_prompt: "bridge"
  category: "bridge"
  standoff_dist_m: 30.0
  standoff_height_m: 18.0

survey:
  pattern: horizontal_orbit
  radius_m: 40.0
  altitude_m: 40.0
  num_laps: 2
  points_per_lap: 24
  heading_overlap: 0.75
  camera_hfov_deg: 80.0

capture:
  native_width: 1280
  native_height: 720
  jpeg_quality: 92
  min_frames: 120

reconstruct:
  backend: colmap
  require_gps: false
