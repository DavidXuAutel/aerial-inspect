# LEARTES BANK — standalone corner building (not waterfront row / cluster).
mission_id: building_solo_001
instruction: "围绕街角独栋 LEARTES BANK 建筑近距离立面环绕拍摄并建模"

# Probed corner block: single classical bank, streets on south/east, row only on north
bridge_centroid_xyz: [-818.0, -96.0, 16.0]

search_area:
  center_xy: [-818.0, -96.0]
  radius_m: 18.0
  altitude_m: 22.0

target:
  visual_prompt: "building"
  category: "building"
  standoff_dist_m: 5.0
  standoff_height_m: 4.0

survey:
  pattern: facade_arc
  radius_m: 5.0
  altitude_m: 20.0
  num_laps: 2
  points_per_lap: 12
  facade_arc_deg: 100.0
  approach_bearing_deg: 270.0   # south street side only — avoid water + north row
  heading_overlap: 0.75
  camera_hfov_deg: 80.0

capture:
  native_width: 1280
  native_height: 720
  jpeg_quality: 92
  min_frames: 24

reconstruct:
  backend: colmap
  require_gps: false
