# Guangzhou central urban AirSim scene (OpenFly env_airsim_gz, ~58.6 km²).
# MapBound from OpenFly configs/env_airsim_gz.yaml: x[-3000,5000] y[-3000,2500] z[-50,300]
scene_id: env_airsim_gz
map_role: guangzhou_urban
airsim_host_local: 127.0.0.1
airsim_host_public: 10.229.20.84
airsim_bind_ip: 0.0.0.0
airsim_port: 41451
vehicle: drone_1
camera: front_custom

# Initial probe / SEARCH center (refine with bridge_scene_probe_grid.py after first render)
spawn_xyz: [1000.0, -250.0, 40.0]
spawn_yaw_deg: 90.0

# Grid probe defaults (Pearl River band — adjust after visual check)
probe_grid:
  x_min: 200.0
  x_max: 2200.0
  x_step: 200.0
  y_min: -800.0
  y_max: 400.0
  y_step: 200.0
  z: 40.0
  yaws_deg: [0.0, 90.0, 180.0, 270.0]
