[project]
name = "aerial-inspect"
version = "0.1.0"
description = "Bridge and infrastructure inspect: find target, survey capture, offline 3D reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aerial-inspect = "aerial_inspect.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aerial_inspect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
